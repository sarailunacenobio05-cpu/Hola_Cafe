          body:
            type: json
            data: |-
              {
                "correo": "admin@holacafe.com",
                "password": "HolaCafe#2026"
              }
        runtime:
          scripts:
            - type: after-response
              code: |-
                if (res.status === 200 && res.body.token) {
                  bru.setEnvVar("token", res.body.token);
                }
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
